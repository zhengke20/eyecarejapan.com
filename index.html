 <p class="count">${rows.length}${t('items')}</p>
 <div class="grid">${rows.map(b=>`<div class="card click" onclick="openB('g',${BRANDS.indexOf(b)})"><h3>${esc(b.n)}</h3>
 <div class="meta"><span class="dot d-${b.t}"></span>${v(b.t)} · ${C[b.c]||b.c} ${yen(b.p)}</div>
 <div class="meta">${b.w.map(v).join(' / ')}</div></div>`).join('')}</div>`;
}
function shopTable(lead,types){
 const rows=SHOPS.filter(s=>types.includes(s.t)&&match(s.n)&&(!f.st||s.t===f.st));
 return `<p class="lead">${t(lead)}</p>${bar('st',types)}
 <p class="count">${rows.length}${t('items')}</p>
 <table><tr><th></th><th>${t('typeCol')}</th><th>${t('shopsCol')}</th><th class="hide-sm">${t('featCol')}</th></tr>
 ${rows.map(s=>`<tr><td><b>${link(s.n,s.u)}</b></td><td>${v(s.t)}</td><td>${s.s}</td><td class="hide-sm">${v('f_'+s.f)}</td></tr>`).join('')}</table>`;
}
function newsTable(lead,kinds){
 const rows=NEWS.filter(n=>kinds.includes(n.k)&&match(n.b)&&(!f.nk||n.k===f.nk));
 return `<p class="lead">${t(lead)}</p>${bar('nk',kinds.length>1?kinds:[])}
 <table><tr><th>${t('dateCol')}</th><th></th><th></th></tr>
 ${rows.map(n=>`<tr><td style="white-space:nowrap">${n.d}</td><td><b>${esc(n.b)}</b><br><span class="meta"><span class="dot d-${n.k}"></span>${v(n.k==='cl'?'color':n.k)}</span></td>
 <td>${esc(n.x[L])}${n.v?`<span class="tag">${t('verify')}</span>`:''} <a class="meta" href="${n.s}" target="_blank" rel="noopener">${t('src')}</a></td></tr>`).join('')}</table>`;
}
function clBrands(){
 const rows=CONTACTS.filter(c=>match(c.n)&&(!f.ct||c.t===f.ct));
 return `<p class="lead">${t('leadCl')}</p>${bar('ct',['clear','color'])}
 <p class="count">${rows.length}${t('items')}</p>
 <div class="grid">${rows.map(c=>`<div class="card click" onclick="openB('c',${CONTACTS.indexOf(c)})"><h3>${esc(c.n)}</h3><div class="meta"><span class="dot d-${c.t}"></span>${v(c.t)}${c.m?' · '+esc(c.m):''}</div></div>`).join('')}</div>`;
}
const PAGES={
 glasses:{brands,shops:()=>shopTable('leadShops',SHOPS.map(s=>s.t).filter((x,i,a)=>!CL_SHOP.includes(x)&&a.indexOf(x)===i)),news:()=>newsTable('leadNews',['frame','smart'])},
 contacts:{brands:clBrands,shops:()=>shopTable('leadClShops',CL_SHOP),news:()=>newsTable('leadClNews',['cl'])},
};
const SECS=[['glasses','sGlasses'],['contacts','sContacts']];
const TABS=[['brands','tBrands'],['shops','tShops'],['news','tNews']];
function go(s,tb,ff){sec=s;tab=tb;q='';f=ff||{};try{history.replaceState(null,'','#'+s+'/'+tb)}catch(e){}render()}
function home(){
 const nb=(arr,fn)=>arr.filter(fn).length;
 const cats=[['cGlasses','glasses','brands',{},nb(BRANDS,b=>b.t!=='smart'&&b.t!=='lens')],['cSmart','glasses','brands',{bt:'smart'},nb(BRANDS,b=>b.t==='smart')],['cLens','glasses','brands',{bt:'lens'},nb(BRANDS,b=>b.t==='lens')],['cClear','contacts','brands',{ct:'clear'},nb(CONTACTS,c=>c.t==='clear')],['cColor','contacts','brands',{ct:'color'},nb(CONTACTS,c=>c.t==='color')],['cShop','glasses','shops',{},0]];
 const news=[...NEWS].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,6);
 const feat=['JINS','Zoff','OWNDAYS','眼鏡市場','金子眼鏡 KANEKO OPTICAL','999.9 (Four Nines)','EYEVAN','MASUNAGA 増永眼鏡','Ray-Ban','Oliver Peoples','TOM FORD','GENTLE MONSTER','LINDBERG','MYKITA','Ray-Ban Meta'];
 const featC=['ACUVUE','DAILIES / PRECISION1 / TOTAL1','1DAY Menicon PREMiO','TOPARDS','LARME','ReVIA','EverColor 1day','meichu'];
 const shops=SHOPS.filter(s=>/^[0-9,約]/.test(s.s)).slice(0,8);
 const tag=n=>{const g=BRANDS.findIndex(b=>b.n===n);return g>=0?`openB('g',${g})`:`openB('c',${CONTACTS.findIndex(c=>c.n===n)})`};
 return `<div class="home"><div class="hero"><h2>${t('heroT')}</h2><p>${t('heroS')}</p>
 <div class="hs"><input type="search" placeholder="${t('search')}" onkeydown="if(event.key==='Enter'){const v=this.value;go('glasses','brands');q=v;render()}"></div></div>
 <h3 class="sh">${t('hFind')}</h3><div class="cats">${cats.map(([k,s,tb,ff,n])=>`<button class="cat" onclick='go("${s}","${tb}",${JSON.stringify(ff)})'><b>${t(k)}</b><span>${n?n+t('brandsN'):SHOPS.length+t('items')}</span></button>`).join('')}</div>
 <h3 class="sh">${t('hPick')}<a onclick="go('glasses','news')">${t('more')}</a></h3>
 <div class="pick">${news.map(n=>`<div class="card"><div class="meta">${n.d} · <span class="dot d-${n.k}"></span>${v(n.k==='cl'?'color':n.k)}</div><h3>${esc(n.b)}</h3><div class="meta">${esc(n.x[L])} <a href="${n.s}" target="_blank" rel="noopener">${t('src')}</a></div></div>`).join('')}</div>
 <h3 class="sh">${t('hBrand')}<a onclick="go('glasses','brands')">${t('more')}</a></h3>
 <div class="bchips">${feat.concat(featC).map(n=>`<button onclick="${tag(n)}">${esc(n)}</button>`).join('')}</div>
 <h3 class="sh">${t('hShop')}<a onclick="go('glasses','shops')">${t('more')}</a></h3>
 <table>${shops.map(s=>`<tr><td><b>${link(s.n,s.u)}</b></td><td class="meta">${v(s.t)}</td><td>${s.s}</td></tr>`).join('')}</table></div>`;
}
const h=location.hash.slice(1).split('/');if(PAGES[h[0]]){sec=h[0];if(PAGES[sec][h[1]])tab=h[1]}

function render(keepFocus){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.getElementById('lang').innerHTML=LANGS.map(l=>`<button class="${l===L?'on':''}" onclick="setL('${l}')">${LN[l]}</button>`).join(' ');
 document.getElementById('sec').innerHTML=SECS.map(([k,n])=>`<button class="${k===sec?'on':''}" onclick="go('${k}',tab)">${t(n)}</button>`).join('');
 document.getElementById('tabs').innerHTML=sec==='home'?'':TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="go(sec,'${k}')">${t(n)}</button>`).join('');
 const m=document.getElementById('main'); m.innerHTML=sec==='home'?home():PAGES[sec][tab]();
 if(keepFocus){const i=m.querySelector('input');if(i){i.focus();i.setSelectionRange(q.length,q.length)}}
}
function openB(kind,i){
 const b=kind==='g'?BRANDS[i]:CONTACTS[i];
 const base=b.n.split(/[ (/（]/)[0].toLowerCase();
 const nw=NEWS.filter(n=>n.b.toLowerCase().startsWith(base)||b.n.toLowerCase().includes(n.b.toLowerCase()));
 let where;
 if(kind==='g'){
  const own=SHOPS.find(s=>s.n.toLowerCase().startsWith(base));
  where=b.w.map(w=>`<li>${v(w)}${w==='own'&&own?' — '+link(own.n,own.u)+' · '+own.s.replace(/ \(.*\)/,'')+t('stores'):''}</li>`).join('');
 }else{
  const ty=b.t==='color'?['cl','clec','clvariety']:['cl','clec'];
  where=SHOPS.filter(s=>ty.includes(s.t)&&(b.t==='color'||s.f!=='color')).map(s=>`<li>${link(s.n,s.u)} <span class="meta">${v(s.t)}</span></li>`).join('');
 }
 const sub=kind==='g'?`${v(b.t)} · ${b.c} ${yen(b.p)}`:`${v(b.t)}${b.m?' · '+esc(b.m):''}`;
 document.getElementById('dlg').innerHTML=`<div class="dlg"><button class="x" onclick="dlg.close()">×</button>
 <h2>${esc(b.n)}</h2><div class="meta"><span class="dot d-${b.t}"></span>${sub}</div>
 ${kind==='c'?`<p class="note">${t('clRx')}</p>`:''}
 <h4>${t('whereBuy')}</h4><ul>${where}</ul>
 ${nw.length?`<h4>${t('newOf')}</h4><ul>${nw.map(n=>`<li><span class="meta">${n.d}</span> ${esc(n.x[L])} <a class="meta" href="${n.s}" target="_blank" rel="noopener">${t('src')}</a></li>`).join('')}</ul>`:''}
 <div class="btns">${b.u?`<a class="btn" href="${b.u}" target="_blank" rel="noopener">${t('official')} ↗</a>`:''}<button class="btn pri" disabled>${t('buyHere')}</button></div></div>`;
 document.getElementById('dlg').showModal();
}
function setL(l){L=l;try{localStorage.setItem('eyeL',l)}catch(e){}render()}
render();
</script>
</body>
</html>
